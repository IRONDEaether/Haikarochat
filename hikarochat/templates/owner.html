<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace propriétaire — HIKAROCHAT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e6f0ff;
  background:radial-gradient(1200px 600px at 50% -10%,#3a0f2a,#05070d);padding:20px}
.card{width:100%;max-width:430px;background:#161020;border:1px solid #52224a;border-radius:18px;padding:26px;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
h1{font-size:1.6rem;text-align:center;margin-bottom:4px;color:#ff2ce0;text-shadow:0 0 20px rgba(255,44,224,.5)}
.sub{text-align:center;color:#c79cbd;font-size:.83rem;margin-bottom:16px}
label{display:block;font-size:.82rem;color:#d3aecb;margin:12px 0 5px}
input{width:100%;padding:11px;border-radius:10px;border:1px solid #52224a;background:#0f0a16;color:#e6f0ff}
input:focus{outline:none;border-color:#ff2ce0}
button{margin-top:20px;width:100%;padding:13px;border:none;border-radius:11px;cursor:pointer;font-weight:800;
  letter-spacing:1px;color:#1a0512;background:linear-gradient(90deg,#ff2ce0,#ff8a3d)}
.err{color:#ff6b81;font-size:.85rem;margin-top:10px;min-height:18px;text-align:center}
.note{font-size:.74rem;color:#a880a0;margin-top:14px;text-align:center;line-height:1.5}
</style></head><body>
<div class="card">
  <h1>🔐 Espace propriétaire</h1>
  <p class="sub">Accès réservé. Triple vérification.</p>
  <label>Pseudo propriétaire</label><input id="pseudo" placeholder="Raphael">
  <label>Mot de passe</label><input id="pw" type="password" placeholder="••••••••">
  <label>Code propriétaire (OWNER_CODE)</label><input id="code" type="password" placeholder="code secret">
  <button id="go">ACCÉDER AU PANNEAU</button>
  <p class="err" id="err"></p>
  <p class="note">Ce code n'est connu que du propriétaire. Toute tentative est journalisée.</p>
</div>
<script>
async function fingerprint(){
  const c=localStorage.getItem('hikaro_bid'); if(c) return c;
  const p=[navigator.userAgent,navigator.language,screen.width+'x'+screen.height,
    new Date().getTimezoneOffset(),navigator.platform||''];
  const b=new TextEncoder().encode(p.join('|'));const h=await crypto.subtle.digest('SHA-256',b);
  const hex=[...new Uint8Array(h)].map(v=>v.toString(16).padStart(2,'0')).join('');
  const id='H-'+hex.slice(0,40);localStorage.setItem('hikaro_bid',id);return id;
}
document.getElementById('go').onclick=async()=>{
  const err=document.getElementById('err');err.textContent='';
  const bid=await fingerprint();
  const r=await fetch('/api/register_owner',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({browser_id:bid,pseudo:document.getElementById('pseudo').value.trim(),
      password:document.getElementById('pw').value,code:document.getElementById('code').value})});
  const j=await r.json();
  if(!j.ok){err.textContent=j.error||'Refusé';return;}
  localStorage.setItem('hikaro_registered',bid);
  localStorage.setItem('hikaro_sig',j.signature);
  location.href='/panel';
};
</script></body></html>
