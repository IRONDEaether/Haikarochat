# Deploiement automatique HIKAROCHAT sur Render (Infrastructure as Code).
# Render lit ce fichier si tu passes par "New +" -> "Blueprint".
services:
  - type: web
    name: hikarochat
    runtime: python
    plan: free                # passe a "starter" pour eviter la mise en veille
    buildCommand: pip install -r requirements.txt
    # VRAI WebSocket temps reel via gunicorn + eventlet (1 worker = etat partage)
    startCommand: gunicorn -k eventlet -w 1 -b 0.0.0.0:$PORT cerveau:app
    healthCheckPath: /health
    envVars:
      # Version Python stable (evite les surprises des versions trop recentes)
      - key: PYTHON_VERSION
        value: "3.10.11"
      # Genere tout seul une cle secrete forte
      - key: SECRET_KEY
        generateValue: true
      # A REMPLIR toi-meme dans le dashboard (laisses vides ici = sync:false)
      - key: OWNER_CODE
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: DATABASE_URL       # LAISSE VIDE si tu utilises Supabase
        sync: false
      - key: SUPABASE_URL       # https://xxxx.supabase.co
        sync: false
      - key: SUPABASE_KEY       # cle service_role (secrete, cote serveur)
        sync: false
      - key: OWNER_PSEUDO
        value: Raphael
      - key: CINEMA_SECURE
        value: "1"
